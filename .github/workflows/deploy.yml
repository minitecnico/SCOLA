# Deploy automático no Cloudflare a cada push na branch main (plano gratuito).
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token com o modelo "Edit Cloudflare Workers" + permissão D1:Edit
#   CLOUDFLARE_ACCOUNT_ID  — ID da conta (painel do Cloudflare, barra lateral)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verificar tipos e gerar o site
        run: npm run build

      - name: Atualizar o banco (migrações D1)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply scola --remote

      - name: Publicar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
